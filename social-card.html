<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: oklch(0.16 0.008 260);
        --card-bg: oklch(0.19 0.008 260);
        --text: oklch(0.96 0.005 260);
        --text-dim: oklch(0.72 0.01 260);
        --border-soft: oklch(0.32 0.01 260);
        --lime: oklch(0.78 0.2 130);
        --lime-dim: oklch(0.78 0.2 130 / 0.5);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--bg);
      }

      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        padding: 68px 72px;
        display: flex;
        align-items: center;
        gap: 48px;
        background: var(--bg);
        color: var(--text);
        font-family: "Inter", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        overflow: hidden;
      }

      /* soft lime glow behind the illustration */
      .card::after {
        content: "";
        position: absolute;
        right: -80px;
        top: 50%;
        width: 520px;
        height: 520px;
        transform: translateY(-50%);
        background: radial-gradient(
          circle,
          oklch(0.78 0.2 130 / 0.14) 0%,
          transparent 68%
        );
        pointer-events: none;
      }

      .content {
        position: relative;
        z-index: 1;
        flex: 1;
        min-width: 0;
      }

      .eyebrow {
        display: flex;
        align-items: center;
        gap: 12px;
        font-family: "JetBrains Mono", monospace;
        font-size: 19px;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: var(--lime);
      }

      .eyebrow .dot {
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: var(--lime);
        flex-shrink: 0;
      }

      h1 {
        margin-top: 30px;
        font-family: "Space Grotesk", sans-serif;
        font-weight: 700;
        font-size: 90px;
        line-height: 0.98;
        letter-spacing: -0.02em;
        color: var(--text);
      }

      .subhead {
        margin-top: 26px;
        font-family: "Space Grotesk", sans-serif;
        font-weight: 500;
        font-size: 29px;
        line-height: 1.3;
        color: var(--lime);
      }

      .meta {
        margin-top: 28px;
        font-family: "JetBrains Mono", monospace;
        font-size: 19px;
        font-weight: 500;
        letter-spacing: 0.01em;
        color: var(--text-dim);
      }

      .brand {
        position: absolute;
        left: 72px;
        bottom: 52px;
        z-index: 1;
        font-family: "Space Grotesk", sans-serif;
        font-weight: 700;
        font-size: 22px;
        letter-spacing: -0.01em;
        color: var(--text);
      }

      .brand span {
        color: var(--lime);
      }

      .frame {
        position: relative;
        z-index: 1;
        width: 396px;
        aspect-ratio: 480 / 411;
        flex-shrink: 0;
        outline: 2px solid var(--lime);
        border-radius: 16px;
        overflow: hidden;
        background: var(--card-bg);
      }

      .frame img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
    </style>
  </head>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Analytics | Abidit Shrestha</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="./assets/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./assets/apple-touch-icon.png"
    />
    <link rel="stylesheet" href="./style.css" />
    <script
      data-goatcounter="https://abidit.goatcounter.com/count"
      async
      src="//gc.zgo.at/count.js"
    ></script>
  </head>
  <body>
    <nav class="navbar">
      <div class="container navbar-content">
        <a href="./index.html" class="logo">AS<span>.dev</span></a>
        <div class="navbar-actions">
          <button
            class="theme-toggle"
            id="theme-toggle"
            aria-label="Toggle color theme"
          >
            ☾
          </button>
        </div>
      </div>
    </nav>

    <section class="section analytics-section">
      <div class="container">
        <div class="section-eyebrow">
          <span class="pulse-dot"></span><span>// ANALYTICS</span>
        </div>
        <h2 class="section-title">Traffic, for my own reference.</h2>
        <div class="analytics-frame">
          <!-- GoatCounter read-only access token — public since this is a static site with no backend. Only exposes traffic stats, not sensitive data. -->
          <iframe
            src="https://abidit.goatcounter.com?access-token=r8317fk39yvbrdg0pa599ldv1944qfizz2c351w0rkaaveu74k&hideui=1"
            style="
              border: 0;
              width: 100%;
              height: 800px;
              border-radius: inherit;
            "
            title="Site analytics dashboard"
            loading="lazy"
          ></iframe>
        </div>
      </div>
    </section>

    <script src="./main.js"></script>
  </body>
</html>
